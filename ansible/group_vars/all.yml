---
# TODO define your group-vars here
sandbox_repo: https://git.tib.eu/terminology/sandbox/tib-terminology-service-statistics
sandbox_version: 68-sandbox-statistics-module-only-process-coypu-collection-but-has-to-process-all-ts-ontologies # Sandbox version that should be installed
sandbox_installation_dir: '{{ansible_env.HOME}}' # installation directory on the target system
sandbox_base_dir: '{{ backend_sandbox_installation_dir }}/SANDBOX' # OLS directory on the target system
backend_dockerfile:
alternative_dockercomposefile:
docker_user: '{{ ansible_user }}'
# Optional space-separated Docker Compose services to deploy. Empty deploys all services.
sandbox_services: ''
# Optional Docker Compose environment file copied after checkout and before deployment.
sandbox_env_file: '.env'
sandbox_env_src: ''
# Optional list of Docker Compose files. Empty keeps Docker Compose default discovery.
sandbox_compose_files: ''
